services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "6333:6333"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      control-api:
        condition: service_healthy
      agent-ingress:
        condition: service_healthy
      qdrant:
        condition: service_started
      ui:
        condition: service_started
      ghost-chatui:
        condition: service_started
      n8n:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ghostdash
      POSTGRES_USER: ghostdash
      POSTGRES_PASSWORD: ghostdash
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostdash -d ghostdash"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  n8n-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    env_file:
      - .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_HOST: workflow.rideai.com.au
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      WEBHOOK_URL: https://workflow.rideai.com.au/
      N8N_EDITOR_BASE_URL: https://workflow.rideai.com.au/
      GENERIC_TIMEZONE: Australia/Sydney
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - "5678"
    depends_on:
      n8n-db:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:gpu-nvidia-latest
    environment:
      QDRANT__GPU__INDEXING: ${QDRANT_GPU_INDEXING:-1}
      QDRANT__GPU__DEVICE_FILTER: ${QDRANT_GPU_DEVICE_FILTER:-}
    gpus:
      - driver: nvidia
        count: all
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
    restart: unless-stopped

  # Local TEI: GhostDASH uses OpenAI-compatible /v1/embeddings at http://tei-embeddings:80/v1 (not host localhost).
  tei-embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:turing-1.9
    environment:
      MODEL_ID: intfloat/multilingual-e5-large-instruct
      MAX_BATCH_TOKENS: "8192"
      MAX_BATCH_REQUESTS: "8"
      MAX_CLIENT_BATCH_SIZE: "8"
      TOKENIZATION_WORKERS: "4"
      HF_HUB_ENABLE_HF_TRANSFER: "1"
    volumes:
      - tei_cache:/data
    expose:
      - "80"
    gpus:
      - driver: nvidia
        count: all
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 300s
    restart: unless-stopped

  workflow-runtime:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "ghostdash_api.workflow_runtime"]
    env_file:
      - .env
    environment:
      APP_DB_URL: postgresql+psycopg://ghostdash:ghostdash@postgres:5432/ghostdash
      APP_DATA_DIR: /data
      APP_UPLOAD_DIR: /data/uploads
      APP_CONTROL_API_BASE_URL: http://control-api:8000
      APP_AGENT_INGRESS_BASE_URL: http://agent-ingress:8001
      APP_WORKFLOW_RUNTIME_URL: http://workflow-runtime:8100
      APP_DOCX_SIDECAR_URL: http://docx-templater:8080
      APP_DEFAULT_CORPUS: ${DEFAULT_CORPUS:-default}
      APP_DEFAULT_POLICY_LANE: ${DEFAULT_POLICY_LANE:-local}
      APP_QDRANT_URL: http://qdrant:6333
      APP_QDRANT_COLLECTION: ${APP_QDRANT_COLLECTION:-ghostdash_knowledge_e5_v1}
      APP_QDRANT_VECTOR_SIZE: ${APP_QDRANT_VECTOR_SIZE:-1024}
      APP_DEFAULT_CHAT_MODEL: ${OPENAI_MODEL:-openai/llama31-8b}
      APP_DEFAULT_EMBEDDING_MODEL: ${APP_DEFAULT_EMBEDDING_MODEL:-openai/intfloat/multilingual-e5-large-instruct}
      APP_LLAMAPARSE_TIER: ${LLAMAPARSE_TIER:-agentic}
    volumes:
      - app_data:/data
    expose:
      - "8100"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      tei-embeddings:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health').read()"]
      interval: 30s
      timeout: 30s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  control-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "ghostdash_api.control_api"]
    env_file:
      - .env
    environment:
      APP_DB_URL: postgresql+psycopg://ghostdash:ghostdash@postgres:5432/ghostdash
      APP_DATA_DIR: /data
      APP_UPLOAD_DIR: /data/uploads
      APP_CONTROL_API_BASE_URL: http://control-api:8000
      APP_AGENT_INGRESS_BASE_URL: http://agent-ingress:8001
      APP_WORKFLOW_RUNTIME_URL: http://workflow-runtime:8100
      APP_DOCX_SIDECAR_URL: http://docx-templater:8080
      APP_DEFAULT_CORPUS: ${DEFAULT_CORPUS:-default}
      APP_DEFAULT_POLICY_LANE: ${DEFAULT_POLICY_LANE:-local}
      APP_QDRANT_URL: http://qdrant:6333
      APP_QDRANT_COLLECTION: ${APP_QDRANT_COLLECTION:-ghostdash_knowledge_e5_v1}
      APP_QDRANT_VECTOR_SIZE: ${APP_QDRANT_VECTOR_SIZE:-1024}
      APP_DEFAULT_CHAT_MODEL: ${OPENAI_MODEL:-openai/llama31-8b}
      APP_DEFAULT_EMBEDDING_MODEL: ${APP_DEFAULT_EMBEDDING_MODEL:-openai/intfloat/multilingual-e5-large-instruct}
      APP_LLAMAPARSE_TIER: ${LLAMAPARSE_TIER:-agentic}
    volumes:
      - app_data:/data
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      workflow-runtime:
        condition: service_healthy
      docx-templater:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  agent-ingress:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "ghostdash_api.agent_ingress"]
    env_file:
      - .env
    environment:
      APP_DB_URL: postgresql+psycopg://ghostdash:ghostdash@postgres:5432/ghostdash
      APP_DATA_DIR: /data
      APP_UPLOAD_DIR: /data/uploads
      APP_CONTROL_API_BASE_URL: http://control-api:8000
      APP_AGENT_INGRESS_BASE_URL: http://agent-ingress:8001
      APP_WORKFLOW_RUNTIME_URL: http://workflow-runtime:8100
      APP_DOCX_SIDECAR_URL: http://docx-templater:8080
      APP_DEFAULT_CORPUS: ${DEFAULT_CORPUS:-default}
      APP_DEFAULT_POLICY_LANE: ${DEFAULT_POLICY_LANE:-local}
      APP_QDRANT_URL: http://qdrant:6333
      APP_QDRANT_COLLECTION: ${APP_QDRANT_COLLECTION:-ghostdash_knowledge_e5_v1}
      APP_QDRANT_VECTOR_SIZE: ${APP_QDRANT_VECTOR_SIZE:-1024}
      APP_DEFAULT_CHAT_MODEL: ${OPENAI_MODEL:-openai/llama31-8b}
      APP_DEFAULT_EMBEDDING_MODEL: ${APP_DEFAULT_EMBEDDING_MODEL:-openai/intfloat/multilingual-e5-large-instruct}
      APP_LLAMAPARSE_TIER: ${LLAMAPARSE_TIER:-agentic}
    volumes:
      - app_data:/data
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
      workflow-runtime:
        condition: service_healthy
      docx-templater:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health').read()"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_AGENT_BASE_URL: /agent
        VITE_APRYSE_LICENSE_KEY: ${VITE_APRYSE_LICENSE_KEY:-}
    environment:
      VITE_API_BASE_URL: /api
      VITE_AGENT_BASE_URL: /agent
      VITE_APRYSE_LICENSE_KEY: ${VITE_APRYSE_LICENSE_KEY:-}
    expose:
      - "4173"
    depends_on:
      control-api:
        condition: service_healthy
      agent-ingress:
        condition: service_healthy
    restart: unless-stopped

  docx-templater:
    build:
      context: ./stack/docx-templater
      dockerfile: Dockerfile
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ghost-chatui:
    build:
      context: ../../Ghost-chatUI
      dockerfile: Dockerfile
    expose:
      - "3000"
    restart: unless-stopped

volumes:
  app_data:
  caddy_data:
  caddy_config:
  postgres_data:
  qdrant_data:
  tei_cache:
  n8n_data:
  n8n_postgres_data:
